<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>217-Store · Админ удирдлага</title>
  <meta name="description" content="217-Store дотуур байрны дэлгүүрийн удирдлагын самбар." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Hallmark · checked: 2026-11-06 · genre: modern-minimal · shape: app screen · v2.0.0 */
    /* critique: Operate-mode admin console with mobile-first responsive header, semantic tokens, and zero emoji icons */
    :root {
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;

      --color-paper: #0b0f17;
      --color-paper-2: #111827;
      --color-paper-3: #1e293b;
      --color-rule: #283548;
      --color-ink: #f8fafc;
      --color-ink-2: #cbd5e1;
      --color-muted: #94a3b8;

      --color-accent: #f59e0b;
      --color-accent-hover: #fbbf24;
      --color-accent-ink: #0f172a;
      --color-focus: #fbbf24;

      --color-success: #22c55e;
      --color-success-paper: #052e16;
      --color-success-ink: #bbf7d0;

      --color-danger: #ef4444;
      --color-danger-paper: #450a0a;
      --color-danger-ink: #fecaca;

      --radius-card: 14px;
      --radius-control: 10px;
      --dur-micro: 120ms;
      --dur-short: 200ms;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html, body {
      overflow-x: clip;
      background-color: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background-color: var(--color-accent);
      color: var(--color-accent-ink);
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .surface-header {
      background-color: var(--color-paper);
      border-bottom: 1px solid var(--color-rule);
    }

    .surface-card {
      background-color: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-card);
    }

    .surface-well {
      background-color: var(--color-paper-3);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-control);
    }

    .badge-pending {
      background-color: #451a03;
      color: #fde68a;
      border: 1px solid #d97706;
    }

    .badge-delivered {
      background-color: var(--color-success-paper);
      color: var(--color-success-ink);
      border: 1px solid #16a34a;
    }

    .badge-false {
      background-color: var(--color-danger-paper);
      color: var(--color-danger-ink);
      border: 1px solid var(--color-danger);
    }

    .btn-primary {
      background-color: var(--color-accent);
      color: var(--color-accent-ink);
      font-weight: 700;
      border-radius: var(--radius-control);
      transition: transform var(--dur-micro) var(--ease-out), background-color var(--dur-short) var(--ease-out);
      cursor: pointer;
    }
    .btn-primary:hover:not(:disabled) {
      background-color: var(--color-accent-hover);
    }
    .btn-primary:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn-secondary {
      background-color: var(--color-paper-3);
      color: var(--color-ink);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-control);
      transition: transform var(--dur-micro) var(--ease-out), background-color var(--dur-short) var(--ease-out);
      cursor: pointer;
    }
    .btn-secondary:hover:not(:disabled) {
      background-color: var(--color-rule);
    }

    .btn-success {
      background-color: var(--color-success);
      color: #052e16;
      font-weight: 700;
      border-radius: var(--radius-control);
      transition: transform var(--dur-micro) var(--ease-out), opacity var(--dur-short) var(--ease-out);
      cursor: pointer;
    }
    .btn-success:hover:not(:disabled) {
      opacity: 0.92;
    }

    .btn-danger {
      background-color: var(--color-danger-paper);
      color: var(--color-danger-ink);
      border: 1px solid var(--color-danger);
      font-weight: 600;
      border-radius: var(--radius-control);
      transition: transform var(--dur-micro) var(--ease-out), opacity var(--dur-short) var(--ease-out);
      cursor: pointer;
    }
    .btn-danger:hover:not(:disabled) {
      opacity: 0.9;
    }

    .input-field {
      background-color: var(--color-paper-3);
      color: var(--color-ink);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius-control);
      font-size: 16px;
    }
    .input-field::placeholder {
      color: var(--color-muted);
    }
    .input-field:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: -1px;
    }

    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="app" class="max-w-3xl mx-auto pb-16"></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
