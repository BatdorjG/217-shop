server {
    listen 80;
    client_max_body_size 25M;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/admin/events {
        proxy_pass http://backend:9090/api/admin/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location /api/admin/ {
        proxy_pass http://backend:9090/api/admin/;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://backend:9090/uploads/;
    }
}
