server {
    listen 80;
    client_max_body_size 25M;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/admin/ {
        proxy_pass http://backend:9090/api/admin/;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://backend:9090/uploads/;
    }
}
